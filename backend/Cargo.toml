[package]
name = "pisces-backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# HTTP layer
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Docker daemon client. Windows: named pipe //./pipe/docker_engine.
bollard = "=0.21.1"

# Kubernetes client, API types only (no cluster is assumed to exist).
kube = "=5.1.0"
k8s-openapi = { version = "=0.29.0", features = ["v1_34"] }

# Auth: argon2 password hash, jsonwebtoken HS256 JWT in an httpOnly cookie.
jsonwebtoken = { version = "=12.0.0", features = ["rust_crypto"] }
argon2 = "=0.6.0"
futures-util = "0.3"
